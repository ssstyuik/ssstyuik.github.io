<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daehyungkim apps</title>
<style>
:root { --bg: #1a1a2e; --card: #25253e; --text: #ffffff; --text-secondary: #a0a0b8; --mint: #00d2a0; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 32px 16px 64px; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  line-height: 1.75; -webkit-text-size-adjust: 100%;
}
main { max-width: 720px; margin: 0 auto; }
h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
.sub { margin: 0 0 32px; font-size: 14px; color: var(--text-secondary); }
.app { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.app h2 { margin: 0 0 4px; font-size: 20px; }
.app p { margin: 0 0 12px; color: var(--text-secondary); }
a { color: var(--mint); }
.links a { margin-right: 16px; }
footer { margin-top: 48px; font-size: 14px; color: var(--text-secondary); }
</style>
</head>
<body>
<main>
  <h1>daehyungkim apps</h1>
  <p class="sub">안드로이드 앱을 만듭니다.</p>

  <div class="app">
    <h2>WordQuest</h2>
    <p>글자판에 숨은 영단어를 찾으며 외우는 단어 게임</p>
    <div class="links">
      <a href="https://ssstyuik.github.io/wordquest-policy/privacy.html">개인정보처리방침</a>
      <a href="https://ssstyuik.github.io/wordquest-policy/terms.html">이용약관</a>
    </div>
  </div>

  <footer>문의: <a href="mailto:daehyung.kim.dev@gmail.com">daehyung.kim.dev@gmail.com</a></footer>
</main>
</body>
</html>
